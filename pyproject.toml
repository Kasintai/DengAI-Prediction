[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dengai"
version = "0.1.0"
description = "Weekly dengue case forecasting for San Juan and Iquitos (DrivenData DengAI)"
requires-python = ">=3.11"
dependencies = [
    "numpy", "pandas", "scipy", "statsmodels", "scikit-learn", "lightgbm", "xgboost", "threadpoolctl",
]

[project.scripts]
dengai = "dengai.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
